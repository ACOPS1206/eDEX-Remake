[package]
name = "edex-native"
version = "0.5.4"
edition = "2024"
description = "Native Wayland terminal and Linux system monitor"

[dependencies]
async-channel = "2.5"
vte4 = { version = "0.10", features = ["v0_72"] }
gtk4 = { version = "0.11", features = ["v4_10"] }
libc = "0.2"
serde_json = "1"
include_dir = "0.7"
sysinfo = { version = "0.37", default-features = false, features = ["system", "component"] }
maxminddb = "0.26"
socket2 = "0.6"
sdl3 = { version = "0.16.4", features = ["use-pkg-config"] }

[profile.release]
lto = "thin"
strip = "symbols"
